<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Elektron soat</title>

<style>
*,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #10172a, #243b55);
    color: #fff;
}

.clock-container {
    text-align: center;
    padding: 45px 35px;
    width: 100%;
    max-width: 600px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 25px;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
    -webkit-backdrop-filter: blur(15px);
    backdrop-filter: blur(15px);
}

h1 {
    font-size: 25px;
    margin-bottom: 30px;
    color: #8be9fd;
    letter-spacing: 3px;
}

.time {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 12px;
    font-size: clamp(42px, 11vw, 75px);
    font-weight: bold;
    letter-spacing: 4px;
    color: #00ffcc;
    text-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
    font-variant-numeric: tabular-nums;
}

.meridiem {
    font-size: 0.3em;
    letter-spacing: 1px;
    color: #8be9fd;
    text-shadow: none;
}

.meridiem[hidden] {
    display: none;
}

.date {
    margin-top: 25px;
    font-size: 20px;
}

.day {
    margin-top: 12px;
    font-size: 17px;
    color: #8be9fd;
}

.zone {
    margin-top: 8px;
    font-size: 14px;
    color: #b8c1d6;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 30px;
}

select,
button {
    font: inherit;
    font-size: 14px;
    color: #fff;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 12px;
    cursor: pointer;
}

select option {
    color: #10172a;
}

select:hover,
button:hover {
    background: rgba(255, 255, 255, 0.18);
}

select:focus-visible,
button:focus-visible {
    outline: 2px solid #00ffcc;
    outline-offset: 2px;
}

.status {
    margin-top: 28px;
    font-size: 13px;
    color: #aab3c7;
    letter-spacing: 2px;
}

.dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-right: 7px;
    background: #00ff88;
    border-radius: 50%;
    box-shadow: 0 0 10px #00ff88;
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    50% { opacity: 0.35; }
}

@media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
}

@media (max-width: 420px) {
    .clock-container { padding: 35px 20px; }
    h1 { font-size: 20px; letter-spacing: 2px; }
}
</style>
</head>

<body>

<main class="clock-container">

    <h1>⏰ ELEKTRON SOAT</h1>

    <div class="time" role="timer" aria-label="Joriy vaqt">
        <span id="clock">00:00:00</span>
        <span class="meridiem" id="meridiem" hidden></span>
    </div>

    <div class="date" id="date">00.00.0000</div>
    <div class="day" id="day">Dushanba</div>
    <div class="zone" id="zone"></div>

    <div class="controls">
        <select id="zoneSelect" aria-label="Vaqt mintaqasi">
            <option value="Asia/Tashkent">Toshkent</option>
            <option value="local">Qurilma vaqti</option>
            <option value="Europe/Moscow">Moskva</option>
            <option value="Europe/Istanbul">Istanbul</option>
            <option value="Europe/London">London</option>
            <option value="America/New_York">Nyu-York</option>
        </select>
        <button type="button" id="formatBtn" aria-pressed="false">24 soatlik</button>
    </div>

    <div class="status">
        <span class="dot"></span>REAL VAQT
    </div>

</main>

<script>
(function () {
    "use strict";

    const WEEK_DAYS = {
        Sun: "Yakshanba",
        Mon: "Dushanba",
        Tue: "Seshanba",
        Wed: "Chorshanba",
        Thu: "Payshanba",
        Fri: "Juma",
        Sat: "Shanba"
    };

    const el = {
        clock: document.getElementById("clock"),
        meridiem: document.getElementById("meridiem"),
        date: document.getElementById("date"),
        day: document.getElementById("day"),
        zone: document.getElementById("zone"),
        zoneSelect: document.getElementById("zoneSelect"),
        formatBtn: document.getElementById("formatBtn")
    };

    // Sozlamalar (saqlanadi)
    const settings = { zone: "Asia/Tashkent", hour12: false };

    try {
        const saved = JSON.parse(localStorage.getItem("clock-settings"));
        if (saved) {
            if (typeof saved.zone === "string") settings.zone = saved.zone;
            if (typeof saved.hour12 === "boolean") settings.hour12 = saved.hour12;
        }
    } catch (e) { /* localStorage mavjud emas yoki buzilgan */ }

    function saveSettings() {
        try {
            localStorage.setItem("clock-settings", JSON.stringify(settings));
        } catch (e) { /* e'tiborsiz qoldiriladi */ }
    }

    // Formatter bir marta yaratiladi, sozlama o'zgarganda qayta quriladi
    let formatter;

    function buildFormatter() {
        const options = {
            hourCycle: "h23",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            weekday: "short"
        };
        if (settings.zone !== "local") options.timeZone = settings.zone;

        try {
            formatter = new Intl.DateTimeFormat("en-US", { ...options, timeZoneName: "shortOffset" });
        } catch (e) {
            try {
                formatter = new Intl.DateTimeFormat("en-US", options);
            } catch (e2) {
                // Noto'g'ri mintaqa bo'lsa, Toshkent vaqtiga qaytamiz
                settings.zone = "Asia/Tashkent";
                options.timeZone = settings.zone;
                formatter = new Intl.DateTimeFormat("en-US", options);
            }
        }
    }

    function setText(node, value) {
        if (node.textContent !== value) node.textContent = value;
    }

    function updateClock() {
        const parts = {};
        formatter.formatToParts(new Date()).forEach(function (p) {
            parts[p.type] = p.value;
        });

        let hours = parseInt(parts.hour, 10);
        let suffix = "";

        if (settings.hour12) {
            suffix = hours >= 12 ? "PM" : "AM";
            hours = hours % 12 || 12;
        }

        const hh = String(hours).padStart(2, "0");
        setText(el.clock, hh + ":" + parts.minute + ":" + parts.second);

        el.meridiem.hidden = !settings.hour12;
        setText(el.meridiem, suffix);

        setText(el.date, parts.day + "." + parts.month + "." + parts.year);
        setText(el.day, WEEK_DAYS[parts.weekday] || parts.weekday);

        const zoneName = settings.zone === "local"
            ? (Intl.DateTimeFormat().resolvedOptions().timeZone || "Qurilma")
            : el.zoneSelect.options[el.zoneSelect.selectedIndex].text;
        const offset = parts.timeZoneName ? " (" + parts.timeZoneName.replace("GMT", "UTC") + ")" : "";
        setText(el.zone, zoneName + offset);
    }

    // Har safar keyingi soniya boshiga tuzatib chaqiriladi
    let timerId;

    function tick() {
        updateClock();
        timerId = setTimeout(tick, 1000 - (Date.now() % 1000));
    }

    function restart() {
        clearTimeout(timerId);
        tick();
    }

    function syncControls() {
        el.zoneSelect.value = settings.zone;
        el.formatBtn.textContent = settings.hour12 ? "12 soatlik" : "24 soatlik";
        el.formatBtn.setAttribute("aria-pressed", String(settings.hour12));
    }

    el.zoneSelect.addEventListener("change", function () {
        settings.zone = el.zoneSelect.value;
        buildFormatter();
        saveSettings();
        restart();
    });

    el.formatBtn.addEventListener("click", function () {
        settings.hour12 = !settings.hour12;
        syncControls();
        saveSettings();
        restart();
    });

    // Vkladka qaytganda darhol yangilash
    document.addEventListener("visibilitychange", function () {
        if (!document.hidden) restart();
    });

    // Saqlangan mintaqa ro'yxatda bo'lmasa, standartga qaytamiz
    if (![].some.call(el.zoneSelect.options, function (o) { return o.value === settings.zone; })) {
        settings.zone = "Asia/Tashkent";
    }

    buildFormatter();
    syncControls();
    tick();
})();
</script>

</body>
</html>
